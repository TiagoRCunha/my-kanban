spring.datasource.url=jdbc:h2:mem:mykanban;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.sql.init.mode=never

# Flyway (test)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
app.jwt.secret=test-only-secret-that-is-longer-than-thirty-two-chars-1234567890
app.jwt.expiration-minutes=120
app.frontend.url=http://localhost:4200
app.seed.admin.enabled=false
