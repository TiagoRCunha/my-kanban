<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your password was changed</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f5f7; font-family: Arial, Helvetica, sans-serif; color: #172b4d;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #f4f5f7; padding: 32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 480px; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(9, 30, 66, 0.08);">
          <tr>
            <td style="background-color: #0052cc; padding: 24px 32px;">
              <h1 style="margin: 0; color: #ffffff; font-size: 22px; font-weight: bold;">MyKanban</h1>
            </td>
          </tr>
          <tr>
            <td style="padding: 32px;">
              <h2 style="margin: 0 0 12px; font-size: 18px;">Hi, <span th:text="${fullName}">there</span>!</h2>
              <p style="margin: 0 0 16px; font-size: 14px; line-height: 1.6;">
                Your password was just changed. If this was you, no further action is needed.
              </p>
              <p style="margin: 0; font-size: 14px; line-height: 1.6;">
                If you did <strong>not</strong> change your password, contact support
                immediately and reset your password from the login page.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
