spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:my_kanban}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-minutes=120
# Startup admin seeding is opt-in. It only runs when explicitly enabled.
app.seed.admin.enabled=${APP_SEED_ADMIN_ENABLED:false}
app.seed.admin.full-name=${APP_SEED_ADMIN_FULL_NAME:Tiago Admin}
app.seed.admin.email=${APP_SEED_ADMIN_EMAIL:}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:}
# The H2 console is exposed over HTTP only when explicitly enabled (dev profile).
app.security.h2-console-enabled=${APP_H2_CONSOLE_ENABLED:false}
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# Mail (SMTP). Sending is disabled by default so tests and CI never contact an SMTP server.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@mykanban.local}

# One-time email tokens (short-lived, purpose-scoped JWTs)
app.token.verification-ttl-minutes=1440
app.token.reset-ttl-minutes=15