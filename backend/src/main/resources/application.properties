spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:my_kanban}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-minutes=120
# Startup admin seeding is opt-in. It only runs when explicitly enabled.
app.seed.admin.enabled=${APP_SEED_ADMIN_ENABLED:false}
app.seed.admin.full-name=${APP_SEED_ADMIN_FULL_NAME:Tiago Admin}
app.seed.admin.email=${APP_SEED_ADMIN_EMAIL:}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:}
# The H2 console is exposed over HTTP only when explicitly enabled (dev profile).
app.security.h2-console-enabled=${APP_H2_CONSOLE_ENABLED:false}
app.frontend.url=${FRONTEND_URL:http://localhost:4200}