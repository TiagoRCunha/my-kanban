<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-card__title">MyKanban</h1>
    <p class="auth-card__subtitle">Reset your password</p>

    @if (errorMessage) {
      <div class="auth-card__error" role="alert">
        {{ errorMessage }}
      </div>
    }

    @if (successMessage) {
      <div class="auth-card__success" role="status">
        {{ successMessage }}
      </div>
    }

    @if (!successMessage) {
      <form class="auth-card__form" (ngSubmit)="onSubmit()">
        <div class="auth-card__field">
          <label class="auth-card__label" for="email">Email</label>
          <input
            class="auth-card__input"
            id="email"
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          />
        </div>

        <button
          class="auth-card__submit"
          type="submit"
          [disabled]="isLoading || !email"
        >
          {{ isLoading ? 'Sending...' : 'Send reset link' }}
        </button>
      </form>
    }

    <p class="auth-card__footer">
      Remembered your password?
      <a class="auth-card__link" routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
