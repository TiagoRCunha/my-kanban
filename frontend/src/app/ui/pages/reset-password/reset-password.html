<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-card__title">MyKanban</h1>
    <p class="auth-card__subtitle">Choose a new password</p>

    @if (errorMessage) {
      <div class="auth-card__error" role="alert">
        {{ errorMessage }}
      </div>
    }

    @if (hasToken) {
      <form class="auth-card__form" (ngSubmit)="onSubmit()">
        <div class="auth-card__field">
          <label class="auth-card__label" for="newPassword">New password</label>
          <input
            class="auth-card__input"
            id="newPassword"
            type="password"
            [(ngModel)]="newPassword"
            name="newPassword"
            placeholder="At least 6 characters"
            required
            minlength="6"
            autocomplete="new-password"
          />
        </div>

        <div class="auth-card__field">
          <label class="auth-card__label" for="confirmPassword">Confirm new password</label>
          <input
            class="auth-card__input"
            id="confirmPassword"
            type="password"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            placeholder="Repeat your password"
            required
            autocomplete="new-password"
          />
        </div>

        <button
          class="auth-card__submit"
          type="submit"
          [disabled]="isLoading || !newPassword || !confirmPassword"
        >
          {{ isLoading ? 'Resetting...' : 'Reset password' }}
        </button>
      </form>

      <p class="auth-card__footer">
        Changed your mind?
        <a class="auth-card__link" routerLink="/login">Sign in</a>
      </p>
    } @else {
      <p class="auth-card__error" role="alert">
        This reset link is missing or invalid. Please request a new one.
      </p>

      <p class="auth-card__footer">
        <a class="auth-card__link" routerLink="/forgot-password">Request a new link</a>
      </p>
    }
  </div>
</div>
