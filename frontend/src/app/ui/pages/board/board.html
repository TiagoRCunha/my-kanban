<app-navbar
  [boardId]="boardId"
  [boardOwnerId]="board?.ownerId ?? null"
  (shareBoard)="onOpenShareDialog()"
/>

<main class="board-page">
  @if (isLoading) {
    <div class="board-page__loading">Loading board...</div>
  } @else if (errorMessage) {
    <div class="board-page__error">
      <p>{{ errorMessage }}</p>
    </div>
  } @else if (board) {
    <div class="board-page__header">
      <h1 class="board-page__title">{{ board.title }}</h1>
    </div>
    <div class="board-page__content">
      <app-board-layout [boardId]="boardId" [boardOwnerId]="board.ownerId" />
    </div>
  }
</main>

<app-share-dialog
  [boardId]="boardId"
  [open]="isShareDialogOpen"
  (closed)="onCloseShareDialog()"
/>
