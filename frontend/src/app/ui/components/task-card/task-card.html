<div
  class="task-card"
  [class.task-card--overdue]="isOverdue"
  [class.task-card--done]="task.done"
  [class.task-card--archived]="isArchived"
  [style.border-left-color]="task.tagColor || '#ccc'"
  (click)="onOpenTask()"
>
  <div class="task-card__content">
    <div class="task-card__header">
      <h3 class="task-card__title">{{ task.title }}</h3>
      <button
        class="task-card__delete-btn"
        type="button"
        aria-label="Delete task"
        (click)="onDeleteTask($event)"
      >
        ×
      </button>
    </div>
    <div class="task-card__meta">
      @if (task.tagName) {
        <span class="task-card__tag" [style.background]="task.tagColor" [style.color]="'#fff'">
          {{ task.tagName }}
        </span>
      }
      @if (task.assigneeIds.length > 0) {
        <span class="task-card__assignees">{{ task.assigneeIds.length }} assignee(s)</span>
      }
      @if (task.dueDate && !task.done) {
        <span class="task-card__due-date" [class.task-card__due-date--overdue]="isOverdue">
          {{ getDueDateLabel(task.dueDate) }}
        </span>
      }
      @if (task.done) {
        <span class="task-card__done-badge">✓ Done</span>
      }
    </div>
    @if (showDoneButton) {
      <button class="task-card__done-btn" type="button" (click)="onDoneTask($event)">
        ✓ Mark as Done
      </button>
    }
    @if (showArchiveButton) {
      <button class="task-card__archive-btn" type="button" (click)="onArchiveTask($event)">
        Archive
      </button>
    }
  </div>
</div>
