<div class="board-layout">
  @if (isLoading) {
    <div class="board-layout__loading">Loading columns...</div>
  } @else {
    <div
      class="board-layout__columns"
      cdkDropList
      cdkDropListOrientation="horizontal"
      [cdkDropListData]="columns"
      [cdkDropListDisabled]="!effectivePermissions.canManageColumns"
      (cdkDropListDropped)="onColumnDrop($event)"
    >
      @for (column of columns; track column.id) {
        <div
          class="board-layout__column-item"
          cdkDrag
          cdkDragLockAxis="x"
          [cdkDragData]="column"
          [cdkDragDisabled]="column.pinned || !effectivePermissions.canManageColumns"
        >
          <app-board-column
            [column]="column"
            [isPinned]="column.pinned"
            [tasks]="getVisibleTasks(column)"
            [hasMoreTasks]="hasMoreTasks(column)"
            [dropListId]="getDropListId(column.id)"
            [connectedDropListIds]="connectedDropListIds"
            [currentUserId]="getCurrentUserId()"
            [isBoardOwner]="isBoardOwner()"
            [permissions]="effectivePermissions"
            [hasDoneColumn]="hasDoneColumn"
            [hasArchiveColumn]="hasArchiveColumn"
            (taskDropped)="onTaskDrop($event)"
            (createTask)="onCreateTask(column.id)"
            (openTask)="onOpenTask(column.id, $event)"
            (deleteTask)="onDeleteTask(column.id, $event)"
            (doneTask)="onDoneTask(column.id, $event)"
            (archiveTask)="onArchiveTask(column.id, $event)"
            (togglePin)="onToggleColumnPin(column.id)"
            (renameColumn)="onRenameColumn(column.id, $event)"
            (deleteColumn)="onDeleteColumn(column.id)"
            (loadMoreTasks)="onLoadMoreTasks(column.id)"
          />
        </div>
      }
    </div>

    @if (effectivePermissions.canManageColumns) {
      <app-column-controller (onAdd)="onAddColumn($event)" />
    }

    <app-task-editor-modal
      [state]="taskEditor"
      [availableTags]="availableTags"
      (close)="onCloseTaskModal()"
      (save)="onSaveTaskChanges($event)"
      (deleteTask)="onDeleteTaskFromModal()"
    />
  }
</div>
