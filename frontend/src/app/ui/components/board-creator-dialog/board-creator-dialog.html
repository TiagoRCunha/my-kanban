@if (isVisible) {
<div class="board-creator" (click)="onClose()">
  <section class="board-creator__modal" (click)="$event.stopPropagation()">
    <header class="board-creator__header">
      <h3 class="board-creator__title">{{ isEditMode ? 'Edit Board' : 'Create Board' }}</h3>
      <button class="board-creator__close" type="button" aria-label="Close board creator" (click)="onClose()">
        &times;
      </button>
    </header>

    <div class="board-creator__content">
      <label class="board-creator__field">
        <h6>Title *</h6>
        <input
          type="text"
          [(ngModel)]="draft.title"
          placeholder="Enter board title"
          maxlength="100"
          autofocus
        />
      </label>

      <label class="board-creator__field">
        <h6>Description</h6>
        <textarea
          rows="4"
          [(ngModel)]="draft.description"
          placeholder="Enter an optional description"
        ></textarea>
      </label>
    </div>

    <footer class="board-creator__actions">
      <app-animated-button label="Cancel" variant="neutral" (pressed)="onClose()" />
      <app-animated-button
        [label]="isEditMode ? 'Save' : 'Create'"
        variant="confirm"
        [disabled]="!canSave"
        (pressed)="onSave()"
      />
    </footer>
  </section>
</div>
}
