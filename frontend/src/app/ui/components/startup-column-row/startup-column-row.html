<div class="col-row">
  <span class="col-row__position">{{ position + 1 }}.</span>

  @if (readonlyTitle) {
    <span class="col-row__label">{{ title }}</span>
  } @else {
    <input
      class="col-row__input"
      type="text"
      [(ngModel)]="editedTitle"
      placeholder="Column title"
      maxlength="50"
      [disabled]="disabled"
    />
  }

  @if (showTypeSelector) {
    <div class="col-row__select-wrap">
      <select
        class="col-row__select"
        [(ngModel)]="editedType"
        [disabled]="disabled"
      >
        <option value="NORMAL">Normal</option>
        <option value="ARCHIVE">Archive</option>
        <option value="DONE">Done</option>
      </select>
    </div>
  }

  <div class="col-row__actions">
    @if (!readonlyTitle) {
      <button
        class="col-row__icon-btn"
        type="button"
        aria-label="Move up"
        [disabled]="disabled || isFirst"
        (click)="moveUp.emit()"
      >
        &#9650;
      </button>
      <button
        class="col-row__icon-btn"
        type="button"
        aria-label="Move down"
        [disabled]="disabled || isLast"
        (click)="moveDown.emit()"
      >
        &#9660;
      </button>
    }

    @if (hasChanges) {
      <app-animated-button label="Save" variant="confirm" [compact]="true" [disabled]="!canSave" (pressed)="onSave()" />
      <app-animated-button label="Cancel" variant="neutral" icon="close" [compact]="true" (pressed)="onCancel()" />
    }

    @if (!readonlyTitle && !isNew) {
      <button
        class="col-row__icon-btn col-row__icon-btn--danger"
        type="button"
        aria-label="Remove column"
        [disabled]="disabled"
        (click)="remove.emit()"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          aria-hidden="true"
        >
          <path d="M3 6H5H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M19 6V20C19 21.1 18.1 22 17 22H7C5.9 22 5 21.1 5 20V6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 6V4C8 2.9 8.9 2 10 2H14C15.1 2 16 2.9 16 4V6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10 11V17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M14 11V17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    }
  </div>
</div>
