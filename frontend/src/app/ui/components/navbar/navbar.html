<nav class="navbar">
  <div class="navbar__brand">
    <a class="navbar__logo-link" routerLink="/boards">
      <span class="navbar__logo">MyKanban</span>
    </a>
  </div>

  <div class="navbar__actions">
    <a class="navbar__link" routerLink="/boards">Boards</a>
    <a class="navbar__link" routerLink="/settings">Settings</a>

    <span class="navbar__user">{{ userName }}</span>

    <button
      class="navbar__icon-btn"
      type="button"
      [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
      (click)="onToggleDarkMode()"
    >
      {{ themeIcon }}
    </button>

    <button
      class="navbar__btn--primary navbar__btn--logout"
      type="button"
      (click)="onLogout()"
    >
      Logout
    </button>
  </div>
</nav>
